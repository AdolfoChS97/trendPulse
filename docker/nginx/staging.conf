# ==============================
# TrendPulse — Nginx Staging
# ==============================
# Server blocks for staging subdomains.
# Include from main nginx.conf or use as standalone.

# Staging API
server {
    listen 80;
    server_name staging-api.trendpulse.app;

    location / {
        proxy_pass http://tp-api-staging:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check for deployment scripts
    location /api/health {
        proxy_pass http://tp-api-staging:4000/api/health;
        access_log off;
    }
}

# Staging PWA
server {
    listen 80;
    server_name staging-app.trendpulse.app;

    location / {
        proxy_pass http://tp-pwa-staging:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
